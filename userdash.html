<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>
    <link rel="stylesheet" href="/static/dashboard.css">
    <link rel="stylesheet" href="/static/home.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <style>
        .card-img-top {
            object-fit: cover;
        }
    </style>
</head>

<body>
    <div id="main">
        <div id="canvas" class="overflow-auto">
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">Welcome, {{ this_user.username }}</a>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page"
                                    href="/userdash/{{ this_user.id }}">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" href="/bookinghistory/{{ this_user.id }}">My Bookings</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" href="/signin">Log Out</a>
                            </li>
                        </ul>
                        <form class="d-flex" action="/usersearch">
                            <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"
                                name="search">
                            <input type="hidden" name="user_id" value="{{ this_user.id }}">
                            <input type="hidden" name="key" value="lot">
                            <input class="btn btn-outline-success" type="submit" value="Search">
                        </form>
                    </div>
                </div>
            </nav>

            <div id="content">
                <h3 class="headings text-center">Available Parking Lots</h3>
                <div class="container">
                    {% for lot in lots %}
                    <div class="card position-relative">
                        <a href="/userlotdetails/{{ lot.id }}/{{this_user.id}}" class="position-relative d-block">
                            <img src="/static/{{ lot.id }}.jpg" class="card-img-top" alt="{{ lot.locname }}">
                            <div class="overlay-title text-black text-center px-2">
                                {{ lot.locname }}
                            </div>
                        </a>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</body>

</html>
