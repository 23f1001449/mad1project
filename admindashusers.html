
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin dashboard</title>
    <link rel="stylesheet" href="/static/dashboard.css">
    <link rel="stylesheet" href="/static/home.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>


<body>
    <div id="main">
        <div id="canvas" class="overflow-auto">
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <a href="#" class="navbar-brand">Welcome, Admin</a>

                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                            <li class="nav-item">
                                <a href="/admindashhome" class="nav-link active" aria-current="page">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page" href="/users">Users</a>
                            </li>
                            <li class="nav-item">
                                <a href="/adminsummary" class="nav-link acitve" aria-current="page">Summary</a>
                            </li>
                            <li class="nav-item">
                                <a href="/signin" class="nav-link acitve" aria-current="page">Log Out</a>
                            </li>
                            
                        </ul>

                        <form class="d-flex" action="/adminsearch">
                            <input type="search" class="form-control me-2" placeholder="Search" aria-label="Search"
                            name="search">
                            <select name="key" aria-label="Default select example" class="form-select me-2">
                                <option selected>Select</option>
                                <option value="user">User</option>
                                <option value="lot">Parking Lot</option>
                            </select>
                            <input type="submit" class="btn btn-outline-success" value="Search">
                        </form>
                    </div>
                </div>
            </nav>

            <div id="content">
                <h3 class="headings text-center">Registered Users</h3>
                <div class="table" style="max-height:500px; overflow-y:scroll">
                    <table class="table border ">
                        <thead>
                            <tr class="text-center">
                                <th scope="col">ID</th>
                                <th scope="col">Email</th>
                                <th scope="col">Full name</th>
                                <th scope="col">Address</th>
                                <th scope="col">Pin code</th>
                            </tr>
                        </thead>
                        <tbody>
                            {%for user in users %}
                            <tr class="text-center">
                                <th scope="row">{{user.id}}</th>
                                <td>{{user.email}}</td>
                                <td>{{user.username}}</td>
                                <td>{{user.address}}</td>
                                <td>{{user.pincode}}</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>    
        </div>
    </div>
</body>

</html>
