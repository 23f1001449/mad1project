<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Parking Spot</title>
    <link rel="stylesheet" href="/static/entry.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>

<body>
    <div id="main">
        <div id="canvas">
            <div id="form-body">
                <h1 class="head">Book a Parking Spot</h1>
                <form method="POST" action="/bookparkingspot">
                    <div class="mb-3">
                        <label for="sid" class="form-label">Spot ID</label>
                        <input type="text" class="form-control" id="sid" name="sid" required>
                    </div>

                    <div class="mb-3">
                        <label for="lid" class="form-label">Lot ID</label>
                        <input type="text" class="form-control" id="lid" name="lid" required>
                    </div>

                    <div class="mb-3">
                        <label for="uid" class="form-label">User ID</label>
                        <input type="text" class="form-control" id="uid" name="uid" required>
                    </div>

                    <div class="mb-3">
                        <label for="vno" class="form-label">Vehicle Number</label>
                        <input type="text" class="form-control" id="vno" name="vno" required>
                    </div>

                    <div class="text-center">
                        <a href="/confirm" class="btn btn-primary w-100 mb-2">Reserve</a>
                        <a href="/userdash" class="btn btn-secondary w-100">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
