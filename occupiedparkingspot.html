<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Occupied Parking Spot Details</title>
    <link rel="stylesheet" href="/static/entry.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>


<body>
    <div id="main">
        <div id="canvas">
            <div id="form-body">
                <h1 class="head">Occupied Parking Spot</h1>
                <div class="mb-3">
                    <label for="id" class="form-label">ID</label>
                    <input type="text" class="form-control" id="id" name="id">
                </div>

                <div class="mb-3">
                    <label for="cid" class="form-label">Customer ID</label>
                    <input type="text" class="form-control" id="cid" name="cid">
                </div>

                <div class="mb-3">
                    <label for="vno" class="form-label">Vehicle number</label>
                    <input type="text" class="form-control" id="vno" name="vno">
                </div>

                <div class="mb-3">
                    <label for="dt" class="form-label">Date/time of parking</label>
                    <input type="text" class="form-control" id="dt" name="dt">
                </div>

                <div class="mb-3">
                    <label for="cost" class="form-label">Est. parking cost</label>
                    <input type="text" class="form-control" id="cost" name="cost">
                </div>

                <div class="text-center">
                    <input type="submit" class="btn btn-secondary w-100" value="Cancel">
                </div>
                </form>
            </div>
        </div>
    </div>
    {% if spot.status == "O" %}
    <div class="card-box mt-4">
        <div class="title">Occupied Parking Spot Details</div>
        <div class="mb-2">
            <label class="form-label">Customer ID</label>
            <input type="text" class="form-control" value="{{ spot.customer_id }}" disabled>
        </div>
        <div class="mb-2">
            <label class="form-label">Vehicle Number</label>
            <input type="text" class="form-control" value="{{ spot.vehicle_number }}" disabled>
        </div>
        <div class="mb-2">
            <label class="form-label">Date/Time of Parking</label>
            <input type="text" class="form-control"
                value="{{ spot.time_of_parking.strftime('%d/%m/%Y %H:%M') if spot.time_of_parking else '' }}" disabled>
        </div>
        <div class="mb-2">
            <label class="form-label">Estimated Parking Cost</label>
            <input type="text" class="form-control" value="{{ spot.estimated_cost }}" disabled>
        </div>
        <a href="/admindashhome" class="btn btn-secondary">Close</a>
    </div>
    {% endif %}
</body>

</html>
