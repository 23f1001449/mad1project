<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin dashboard</title>
    <link rel="stylesheet" href="/static/dashboard.css">
    <link rel="stylesheet" href="/static/home.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <style>
        .card img-top{
            object-fit: cover;
        }

        .overlay-title a{
            text-decoration:none;
            color:black !important;
        }
    </style>
</head>

<body>
    <div id="main">
        <div id="canvas" class="overflow-auto">
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
                <div class="container-fluid">
                    <a href="#" class="navbar-brand">Welcome, Admin</a>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                            <li class="nav-item">
                                <a href="/admindashhome" class="nav-link active" aria-current="page">Home</a>
                            </li>
                            <li class="nav-item">
                                <a href="/admindashusers" class="nav-link active" aria-current="page">Users</a>
                            </li>
                            <li class="nav-item">
                                <a href="/adminsummary" class="nav-link active" aria-current="page">Summary</a>
                            </li>
                            <li class="nav-item">
                                <a href="/signin" class="nav-link active" aria-current="page">Log Out</a>
                            </li>

                        </ul>
                        <form class="d-flex"action="/adminsearch">
                            <input type="search" class="form-control me-2" placeholder="Search" aria-label="Search" name="search">
                            <select class="form-select me-2" name="key" aria-label="Default select example">
                                <option selected>Select</option>
                                <option value="user">User</option>
                                <option value="lot">Parking Lot</option>
                            </select>
                            <input type="submit" class="btn btn-outline-success" value="Search">
                        </form>
                    </div>
                </div>
            </nav>

            <div id="content">
                <h3 class="headings text-center">Parking Lots</h3>
                <div class="container">
                    {% for lot in lots%}
                    <div class="card position-relative">
                        <a href="/lotdetails/{{ lot.id }}" class="position-relative d-block">
                            <img src="/static/{{ lot.id }}.jpg" class="card-img-top" alt="{{ lot.locname }}">
                            <div class="overlay-title text-black text-center px-2">{{ lot.locname }}</div>
                        </a>
                        <div class="d-flex justify-content-between px-2 mt-2 mb-2 gap-2">
                            <a href="/editparkinglot/{{ lot.id }}" class="btn btn-sm btn-warning w-100">Edit</a>
                            <form method="POST" action="/deleteparkinglot/{{ lot.id }}" style="width:100%;">
                                <button class="btn btn-sm btn-danger w-100 " type="submit">Delete</button>
                            </form>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
            <div class="text-end mx-2 my-5">
                <a href="/newparkinglot" class="btn btn-primary">Add Lot</a>
            </div>
        </div>
    </div>
    
</body>
</html>
