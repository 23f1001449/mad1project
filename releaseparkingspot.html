<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Release the Parking Spot</title>
    <link rel="stylesheet" href="/static/entry.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>


<body>
    <div id="main">
        <div id="canvas">
            <div id="form-body">
                <h1 class="head">Release the Parking Spot</h1>
                <div class="mb-3">
                    <label for="sid" class="form-label">Spot ID</label>
                    <input type="text" class="form-control" id="sid" name="sid">
                </div>

                <div class="mb-3">
                    <label for="vno" class="form-label">Vehicle Number</label>
                    <input type="text" class="form-control" id="vno" name="vno">
                </div>

                <div class="mb-3">
                    <label for="pt" class="form-label">Parking time</label>
                    <input type="text" class="form-control" id="pt" name="pt">
                </div>

                <div class="mb-3">
                    <label for="rt" class="form-label">Releasing time</label>
                    <input type="text" class="form-control" id="rt" name="rt">
                </div>

                <div class="mb-3">
                    <label for="tc" class="form-label">Total Cost</label>
                    <input type="text" class="form-control" id="tc" name="tc">
                </div>

                <div class="text-center">
                    <input type="submit" class="btn btn-primary w-100 mb-2" value="Release">
                    <input type="submit" class="btn btn-secondary w-100" value="Cancel">
                </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
