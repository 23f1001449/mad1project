

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Occupied Spot Details</title>
    <link rel="stylesheet" href="/static/entry.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>

<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5"> 
                <div class="card shadow p-4">
                    <h1 class="mb-4 text-center fw-bold display-6">Occupied Parking Spot Details</h1>

                    <div class="mb-3">
                        <label class="form-label">Spot ID</label>
                        <input type="text" class="form-control" value="{{ spot.id }}" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Customer ID</label>
                        <input type="text" class="form-control" value="{{ spot.customer_id }}" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Vehicle Number</label>
                        <input type="text" class="form-control" value="{{ spot.vehicle_number }}" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Time of Parking</label>
                        <input type="text" class="form-control"
                            <input type="text" class="form-control" value="{{ spot.time_of_parking }} hour(s)" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Estimated Parking Cost</label>
                        <input type="text" class="form-control" value="{{ total_cost }}" readonly>
                    </div>
                </div>
            </div>    
        </div>
    </div>
</body>

</html>
