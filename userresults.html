<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Search Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
            font-family: Arial, sans-serif;
        }

        .container {
            margin-top: 50px;
        }

        .result-card {
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            transition: transform 0.2s;
        }

        .result-card:hover {
            transform: translateY(-5px);
        }

        .no-results {
            text-align: center;
            padding: 50px 0;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #007bff;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2 class="mb-4 text-center">Search Results for "{{ search_word }}"</h2>

        {% if results %}
        <div class="row">
            {% for lot in results %}
            <div class="col-md-4 mb-4">
                <div class="card result-card">
                    <div class="card-body">
                        <h4 class="card-title">{{ lot.locname }}</h4>
                        <p class="card-text">
                            <strong>Address:</strong> {{ lot.address }} <br>
                            <strong>Pincode:</strong> {{ lot.pincode }}
                        </p>
                        <a href="/userlotdetails/{{ lot.id }}/{{ user_id }}" class="btn btn-primary">View Details</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
        {% else %}
        <div class="no-results">
            <h4>No results found.</h4>
            <a href="/userdash/{{ user_id }}" class="back-link">← Go Back</a>
        </div>
        {% endif %}
    </div>
</body>

</html>
